# NVIDIA device plugin for k3s, limited to ONE GPU node (replace GPU-NODE-NAME below, or use a label). Apply ONLY after the driver +
# nvidia-container-toolkit + k3s-agent restart are done and `sudo grep -n nvidia /var/lib/rancher/k3s/agent/etc/containerd/config.toml` shows
# the nvidia runtime. Upstream static manifest v0.20.1 + runtimeClassName: nvidia (without it the plugin sees no GPU on k3s) + nodeSelector.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: GPU-NODE-NAME      # <- replace with your GPU node (kubectl get nodes)
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
      - name: nvidia-device-plugin-ctr
        image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1
        env:
        - name: FAIL_ON_INIT_ERROR
          value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
