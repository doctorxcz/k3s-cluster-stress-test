<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4466"/>
      <stop offset="1" stop-color="#132C44"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A5C"/>
      <stop offset="1" stop-color="#E0483E"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- load gauge -->
  <g fill="none" stroke-width="30" stroke-linecap="round">
    <path d="M104.4 367.5 A175 175 0 0 1 143.5 145.9" stroke="#3BB5A0"/>
    <path d="M143.5 145.9 A175 175 0 0 1 368.5 145.9" stroke="#F2B33D"/>
    <path d="M368.5 145.9 A175 175 0 0 1 407.6 367.5" stroke="#E0483E"/>
  </g>

  <!-- cluster links -->
  <g stroke="#9FB6CA" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="218" x2="198" y2="318"/>
    <line x1="256" y1="218" x2="314" y2="318"/>
    <line x1="198" y1="318" x2="314" y2="318"/>
  </g>

  <!-- nodes -->
  <circle cx="198" cy="318" r="32" fill="#E8EEF3"/>
  <circle cx="256" cy="218" r="32" fill="#E8EEF3"/>
  <circle cx="314" cy="318" r="34" fill="url(#hot)" filter="url(#glow)"/>

  <!-- node cores -->
  <circle cx="198" cy="318" r="11" fill="#1F4466"/>
  <circle cx="256" cy="218" r="11" fill="#1F4466"/>
  <circle cx="314" cy="318" r="11" fill="#FFF1EC"/>
</svg>
